name: Synthetic tests

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and demo
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install recorded Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate synthetic data
        run: python examples/generate_demo.py --output-dir outputs/ci-demo
      - name: Run daily experiment
        run: python scripts/run_experiment.py --config outputs/ci-demo/configs/daily.json
      - name: Run monthly experiment
        run: python scripts/run_experiment.py --config outputs/ci-demo/configs/monthly.json
      - name: Show failed experiment logs
        if: failure()
        run: |
          if [ -d outputs/ci-demo/runs ]; then
            find outputs/ci-demo/runs -name '*.log' -exec tail -n 80 {} \;
          fi

  r:
    name: R locked environment and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libpng-dev libtiff-dev libjpeg-dev libglpk-dev gfortran libblas-dev liblapack-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: Network reconstruction and small estimation
        run: Rscript tests/test_network.R . --with-estimation
      - name: Network features
        run: Rscript tests/test_features.R .
      - name: Asset pricing
        run: Rscript tests/test_asset_pricing.R .
